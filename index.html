<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Diwali Surprise ✨</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Sparkle effect */
        .sparkle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #ffd700;
            border-radius: 50%;
            animation: floatSparkle 3s infinite linear;
            pointer-events: none;
        }

        @keyframes floatSparkle {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        .container {
            width: 90%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            z-index: 10;
            transition: all 0.5s ease;
        }

        .card-header {
            font-size: 14px;
            color: #ffca28;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        p {
            font-size: 17px;
            line-height: 1.6;
            color: #e0e0e0;
            margin-bottom: 30px;
            min-height: 90px;
        }

        .btn {
            background: linear-gradient(135deg, #ff9800, #ff5722);
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 87, 34, 0.4);
            transition: transform 0.2s, background 0.2s;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .progress-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 20px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transition: background 0.3s;
        }

        .dot.active {
            background: #ffca28;
            width: 20px;
            border-radius: 4px;
        }

        .roast-box {
            font-size: 26px;
            color: #ff5252;
            font-weight: 850;
            text-shadow: 0 0 15px rgba(255, 82, 82, 0.6);
            animation: bounce 0.6s infinite alternate;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-8px); }
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Background Sparkles Container -->
    <div id="sparkles-container"></div>

    <div class="container" id="app-card">
        <div class="card-header" id="card-tag">Special Delivery 🪔</div>
        <h1 id="card-title">Utkarsh Mishra ne aapke liye kuch khas bheja hai! ✨</h1>
        <p id="card-content">Tap karke dekho andar kya hai... 😉</p>
        
        <button class="btn" id="action-btn" onclick="nextStep()">Surprise Dekho 🎁</button>
        
        <div class="progress-dots" id="dots-container">
            <div class="dot active"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>

    <script>
        // Generate floating background sparkles
        const sContainer = document.getElementById('sparkles-container');
        for(let i=0; i<25; i++) {
            const sp = document.createElement('div');
            sp.className = 'sparkle';
            sp.style.left = Math.random() * 100 + 'vw';
            sp.style.animationDuration = (2 + Math.random() * 3) + 's';
            sp.style.animationDelay = (Math.random() * 3) + 's';
            sContainer.appendChild(sp);
        }

        const steps = [
            {
                tag: "Utkarsh Mishra ki taraf se 🪔",
                title: "Aapke Liye Pyari Si Wish...",
                text: "Deepo ki light, mithaiyo ki sweet-ness,<br>Diwali ka ye pyara sa festival happiness...<br>Hamesha muskurati raho tum bina kisi reason,<br>Happy Diwali to the sweetest person! ✨🎆",
                btn: "Aage Badho 👉"
            },
            {
                tag: "Dosti & Vibes ✨",
                title: "Thodi Si Taarif...",
                text: "Har din tumhari life me nayi roshni aaye,<br>Jo chaaho tum, wo sab khushiyan mil jaye...<br>Dosti ka ye bond hamesha aise hi chamke,<br>Diwali par tumhara har sapna poora ho jaye! 🪔",
                btn: "Next Dekho 🎯"
            },
            {
                tag: "Ek Chota Sa Favour 📝",
                title: "Real Talk...",
                text: "Roshni se saja hai poora aangan aur ghar,<br>Dua hai ki tum par kabhi na aaye koi fikar...<br>Itni pyari wish ke badle me bas ek favor kar dena,<br>Waqt mile toh mere thode se <b>diagrams bana dena</b>! 🎨",
                btn: "Aakhri Step 🚀"
            },
            {
                tag: "⚠️ WARNING ⚠️",
                title: "The Climax Moment!",
                text: "Ab aakhri button dabane se pehle dil tham lena,<br>Kyunki sachai bahar aane wali hai... Ready ho?",
                btn: "Final Surprise 💥"
            },
            {
                tag: "THE ROAST 🤪",
                title: "",
                text: "<div class='roast-box'>Bas kar bauni!<br>Kitna khushi ho rahi hai dekh dekh ke! 😜🔥</div>",
                btn: "Wapas Shuru Karo 🔄"
            }
        ];

        let currentStep = 0;

        function nextStep() {
            currentStep++;
            if (currentStep >= steps.length) {
                currentStep = 0; // Loop back or reset
            }

            const data = steps[currentStep];
            document.getElementById('card-tag').innerHTML = data.tag;
            document.getElementById('card-title').innerHTML = data.title;
            document.getElementById('card-content').innerHTML = data.text;
            document.getElementById('action-btn').innerHTML = data.btn;

            // Update dots
            const dots = document.querySelectorAll('.dot');
            dots.forEach((dot, index) => {
                if(index === currentStep) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            });

            // Hide dots on final roast screen for cleaner look
            if(currentStep === 4) {
                document.getElementById('dots-container').style.display = 'none';
            } else {
                document.getElementById('dots-container').style.display = 'flex';
            }
        }
    </script>
</body>
</html>
