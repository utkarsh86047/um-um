<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Mission: Sagun Tiwari 🪔</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a0033, #2e0854, #0f0c29);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Glowing background particles */
        .particle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #ffeb3b;
            border-radius: 50%;
            animation: floatUp 4s infinite linear;
            pointer-events: none;
            box-shadow: 0 0 10px #ff9800;
        }

        @keyframes floatUp {
            0% { transform: translateY(105vh) scale(0.2); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        .container {
            width: 90%;
            max-width: 440px;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 28px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            z-index: 10;
            transition: all 0.4s ease;
        }

        .card-header {
            font-size: 13px;
            color: #ffca28;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            margin-bottom: 12px;
            font-weight: 800;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 18px;
            line-height: 1.4;
            color: #fff;
        }

        .highlight-name {
            color: #ff9800;
            font-size: 26px;
            display: block;
            margin-top: 5px;
            text-shadow: 0 0 10px rgba(255, 152, 0, 0.5);
        }

        p {
            font-size: 16px;
            line-height: 1.7;
            color: #e0e0e0;
            margin-bottom: 30px;
            min-height: 110px;
        }

        .btn {
            background: linear-gradient(135deg, #ff9800, #ff3d00);
            color: white;
            border: none;
            padding: 14px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(255, 61, 0, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:active {
            transform: scale(0.94);
        }

        .progress-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 25px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            transition: all 0.3s;
        }

        .dot.active {
            background: #ffca28;
            width: 22px;
            border-radius: 4px;
        }

        .roast-box {
            font-size: 25px;
            color: #ff5252;
            font-weight: 900;
            text-shadow: 0 0 20px rgba(255, 82, 82, 0.7);
            animation: pulseGlow 0.8s infinite alternate;
            line-height: 1.5;
        }

        @keyframes pulseGlow {
            from { transform: scale(1); filter: brightness(1); }
            to { transform: scale(1.05); filter: brightness(1.2); }
        }
    </style>
</head>
<body>

    <!-- Background Sparkles -->
    <div id="particle-container"></div>

    <div class="container" id="app-card">
        <div class="card-header" id="card-tag">SPECIAL DELIVERY 🪔</div>
        <h1 id="card-title">Utkarsh Mishra ne kuch bheja hai <span class="highlight-name">Sagun Tiwari</span> ke liye! ✨</h1>
        <p id="card-content">Zra screen par tap karke dekho andar kya raaz chhupe hain... 😉</p>
        
        <button class="btn" id="action-btn" onclick="nextStep()">Kholo Isko 🎁</button>
        
        <div class="progress-dots" id="dots-container">
            <div class="dot active"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>

    <script>
        // Floating background particles generator
        const pContainer = document.getElementById('particle-container');
        for(let i=0; i<30; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + 'vw';
            p.style.animationDuration = (3 + Math.random() * 3) + 's';
            p.style.animationDelay = (Math.random() * 3) + 's';
            pContainer.appendChild(p);
        }

        const steps = [
            {
                tag: "DIWALI SPECIAL VIBES 🪔",
                title: "A Very Special Wish ✨",
                text: "Deepo ki roshni aur mithaiyon ki mithas,<br>Tiwari ji, aapke aane se ban jati hai khas!<br>Hamesha aise hi muskurao aur chamakti raho,<br>Happy Diwali! ✨🎆",
                btn: "Aage Badho 👉"
            },
            {
                tag: "DOSTI & VIBES ✨",
                title: "Dosti Ki Sparkle 💫",
                text: "Life me chahe jitne bhi ho nakhre aur tension,<br>Apni dosti ka level hai ekdum top-notch dimension!<br>Dua hai ki is Diwali aapke saare sapne poore ho jaye,<br>Aur bank balance bina mange double ho jaye! 💰",
                btn: "Agla Card Dekho 🎯"
            },
            {
                tag: "FESTIVE FAVOUR 📝",
                title: "A Small Festive Favor 🎁",
                text: "Tyohar ka mausam hai, sab khush hain apne ghar,<br>Tiwari ji, ek choti si help chahiye agar ho sake agar...<br>Badle me itni pyari wish de raha hoon, toh maan lena,<br>Waqt nikal kar mere thode se <b>diagrams bana dena</b>! 🎨",
                btn: "Last Step Bachha Hai 🚀"
            },
            {
                tag: "ALMOST THERE 🎇",
                title: "One Last Wish For You 🎆",
                text: "Dekho Tiwari ji, aakhri step par aate-aate saari best wishes de di hain... ab bas ek aakhri pyari si cheez bachi hai dekhne ke liye! 🌟",
                btn: "Final Dhamaka 💥"
            },
            {
                tag: "THE ULTIMATE ROAST 🤪",
                title: "",
                text: "<div class='roast-box'>Bas kar bauni!<br>Kitna khushi ho rahi hai dekh dekh ke! 😜🔥</div>",
                btn: "Dobara Mazaa Lo 🔄"
            }
        ];

        let currentStep = 0;

        function nextStep() {
            currentStep++;
            if (currentStep >= steps.length) {
                currentStep = 0; 
            }

            const data = steps[currentStep];
            document.getElementById('card-tag').innerHTML = data.tag;
            document.getElementById('card-title').innerHTML = data.title;
            document.getElementById('card-content').innerHTML = data.text;
            document.getElementById('action-btn').innerHTML = data.btn;

            // Dots tracker update
            const dots = document.querySelectorAll('.dot');
            dots.forEach((dot, index) => {
                if(index === currentStep) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            });

            // Hide dots on final roast screen
            if(currentStep === 4) {
                document.getElementById('dots-container').style.display = 'none';
            } else {
                document.getElementById('dots-container').style.display = 'flex';
            }
        }
    </script>
</body>
</html>
